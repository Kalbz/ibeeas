buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        // Ensure Gradle version is correct for your project
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10' // Keep Kotlin compatible with Gradle
        classpath 'com.google.gms:google-services:4.3.15' // Add Google Services for Firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Ensure compatibility and proper build directory management
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

// Clean task for cleaning build directory
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
