plugins {
    id "com.android.application"
    id "com.google.gms.google-services" // For Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace = "com.example.flutter_application_1"
    compileSdk = 35 // Correct property assignment
    defaultConfig {
        minSdk = 23 // Correct property assignment
        targetSdk = 35 // Correct property assignment
        applicationId "com.example.flutterApplication2"
        ndkVersion "25.1.8937393"
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10" // Ensure Kotlin is updated
}
